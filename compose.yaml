# StudyTasks - Entrega 2: aplicación + PostgreSQL con red y volumen
name: studytasks

services:
  web:
    build: .                      # imagen PROPIA, construida con el Dockerfile
    image: studytasks:2.0
    container_name: studytasks-web
    ports:
      - "${APP_PORT:-5000}:5000"  # único puerto expuesto al anfitrión
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DB_HOST: db                 # el nombre del servicio es el nombre DNS en la red
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy   # arranca la web solo cuando la BD está lista
    networks:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: studytasks-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB en el archivo .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER en el archivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data   # persistencia de los datos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    # Sin "ports": PostgreSQL solo es accesible desde la red interna "backend"
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
